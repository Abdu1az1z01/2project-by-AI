# Конфигурация AI-помощника.
# Скопируйте этот файл в config.yaml и отредактируйте под себя.
# Пути можно писать с ~ (домашняя папка). Всё, что не перечислено здесь, помощнику НЕДОСТУПНО.

model: claude-opus-5-5
effort: medium            # low | medium | high | xhigh | max — глубина размышлений

# Папки, которые помощник может ЧИТАТЬ (и просматривать содержимое).
read_roots:
  - ~/Documents
  - ~/Downloads
  - ~/Desktop

# Папки, в которые помощник может ПИСАТЬ/перемещать/создавать файлы.
# Должны быть внутри read_roots (или совпадать с ними).
write_roots:
  - ~/Downloads
  - ~/Desktop/AI-workspace

# Пути, к которым доступ запрещён всегда, даже если они внутри read_roots.
deny_patterns:
  - "*/.ssh*"
  - "*/.gnupg*"
  - "*password*"
  - "*.key"
  - "*.pem"
  - "*/.env"
  - "*wallet*"

# Программы, которые помощник может запускать (только имя программы, без оболочки).
# Пусто = запуск команд запрещён полностью.
allowed_commands:
  - git
  - ls
  - du
  - df

# Спрашивать подтверждение перед каждым изменением файлов / запуском команды
# в интерактивном режиме (chat). В автономном режиме (auto) подтверждений нет,
# поэтому ограничивайте write_roots и allowed_commands аккуратно.
confirm_in_chat: true

# Автономный режим: за чем следить и какие цели преследовать.
autonomous:
  interval_seconds: 120         # как часто осматривать систему
  max_tool_calls_per_cycle: 25  # предохранитель от бесконечных циклов
  max_cycles_per_hour: 10       # ограничение расходов на API
  watch_dirs:                   # папки, изменения в которых отслеживаются
    - ~/Downloads
    - ~/Desktop
  thresholds:                   # при превышении — повод для анализа
    cpu_percent: 90
    memory_percent: 90
    disk_percent: 92
  goals: |
    - Поддерживай порядок в папке Загрузки: раскладывай новые файлы по подпапкам
      по типу (Документы, Изображения, Архивы, Установщики, Прочее).
    - Если диск почти заполнен — найди самые большие файлы в доступных папках
      и сообщи мне (ничего не удаляй сам).
    - Если какой-то процесс долго грузит процессор — сообщи мне.
    - Записывай в память полезные наблюдения о моих привычках, чтобы
      со временем действовать точнее.

# Где хранить журнал, память, корзину и уведомления помощника.
data_dir: ~/.ai-assistant
